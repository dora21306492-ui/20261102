<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <!-- 響應式網頁：手機寬度等於裝置寬度，並禁止縮放（避免拖曳時畫面亂動） -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>認識台灣原生種｜多媒體測驗</title>
  <!-- 字型：Google Fonts「Chocolate Classical Sans」（需要網路；沒有網路時會改用系統的中文字型） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chocolate+Classical+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- p5.js：使用專案內 libraries/ 的本機版本（不需要網路） -->
  <script src="libraries/p5.min.js"></script>
  <script src="config.js"></script>    <!-- 設定區：專案、學習目標、功能、風格、素材 -->
  <script src="species.js"></script>   <!-- 物種題庫 -->
  <script src="scenes.js"></script>    <!-- 動物插圖 -->
  <script src="avatar.js"></script>    <!-- 探險家角色 -->
  <script src="backdrop.js"></script>  <!-- 背景動畫 -->
  <script src="audio.js"></script>     <!-- 音效與背景音樂 -->
  <script src="games.js"></script>     <!-- 三種玩法、圖鑑、成績 -->
  <script src="extras.js"></script>    <!-- 成就、每日挑戰、明信片 -->
  <script src="progress.js"></script>  <!-- 我的進步：和自己前幾次比 -->
  <script src="learn.js"></script>     <!-- 特有種小教室、每日學習、展示動物設定 -->
  <script src="room.js"></script>      <!-- 房間、桌面、新手教學 -->
  <script src="sketch.js"></script>    <!-- 主程式 -->
</head>
<body></body>
</html>
